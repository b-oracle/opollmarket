name: Edge Functions Typecheck

on:
  push:
    paths:
      - "supabase/functions/**"
      - "scripts/check-edge-functions.sh"
      - ".github/workflows/edge-functions-typecheck.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "scripts/check-edge-functions.sh"
      - ".github/workflows/edge-functions-typecheck.yml"

jobs:
  typecheck:
    name: deno check (supabase/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Cache Deno modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Type-check all edge functions
        run: bash scripts/check-edge-functions.sh
